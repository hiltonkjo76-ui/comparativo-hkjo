name: Compilar APK Inventario

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Crear proyecto Android (Trusted Web Activity)
        run: |
          set -e
          A=android
          R=$A/app/src/main/res
          mkdir -p $R/values $R/mipmap-anydpi-v26
          cat > $A/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'InventarioHkjo'
          include ':app'
          EOF
          cat > $A/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.9.1' apply false }
          EOF
          cat > $A/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          android.suppressUnsupportedCompileSdk=37
          EOF
          cat > $A/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.hkjo.inventario'
            compileSdk 37
            defaultConfig {
              applicationId 'com.hkjo.inventario'
              minSdk 21
              targetSdk 37
              versionCode Integer.parseInt(System.getenv('VCODE') ?: '1')
              versionName '1.' + (System.getenv('VCODE') ?: '1')
            }
            signingConfigs {
              release {
                storeFile file('release.jks')
                storePassword System.getenv('KS_PASS')
                keyAlias 'hkjo'
                keyPassword System.getenv('KS_PASS')
              }
            }
            buildTypes {
              release { minifyEnabled false; signingConfig signingConfigs.release }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
          EOF
          cat > $A/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <queries>
              <intent><action android:name="android.support.customtabs.action.CustomTabsService" /></intent>
            </queries>
            <application
                android:label="@string/app_name"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:allowBackup="true"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Translucent.NoTitleBar">
              <meta-data android:name="asset_statements" android:resource="@string/asset_statements" />
              <activity
                  android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                  android:label="@string/app_name"
                  android:exported="true">
                <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL" android:value="https://hiltonkjo76-ui.github.io/inventario-hkjo/?app=1" />
                <meta-data android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR" android:resource="@color/barra" />
                <meta-data android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR" android:resource="@color/barra" />
                <meta-data android:name="android.support.customtabs.trusted.FALLBACK_STRATEGY" android:value="customtabs" />
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
              <activity android:name="com.google.androidbrowserhelper.trusted.FocusActivity" />
              <activity android:name="com.google.androidbrowserhelper.trusted.WebViewFallbackActivity"
                  android:configChanges="orientation|screenSize" />
            </application>
          </manifest>
          EOF
          cat > $R/values/strings.xml <<'EOF'
          <resources>
            <string name="app_name">Inventario Hkjo.</string>
            <string name="asset_statements">[{\"relation\": [\"delegate_permission/common.handle_all_urls\"], \"target\": {\"namespace\": \"web\", \"site\": \"https://hiltonkjo76-ui.github.io\"}}]</string>
          </resources>
          EOF
          cat > $R/values/colors.xml <<'EOF'
          <resources>
            <color name="barra">#2E5576</color>
          </resources>
          EOF
          cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_fondo" />
            <foreground android:drawable="@mipmap/ic_frente" />
          </adaptive-icon>
          EOF
          cp $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
          mkdir -p $R/drawable
          cat > $R/drawable/ic_fondo.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <gradient android:type="linear" android:angle="270"
                android:startColor="#5C8BAE" android:centerColor="#3A6385" android:endColor="#244460" />
          </shape>
          EOF

      - name: Iconos
        run: |
          set -e
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          R=android/app/src/main/res
          curl -sSfL -o icono-512.png https://raw.githubusercontent.com/hiltonkjo76-ui/inventario-hkjo/main/icon-512.png
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            n=${d%%:*}; r=${d#*:}; s=${r%%:*}; a=${r#*:}
            mkdir -p $R/mipmap-$n
            convert icono-512.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png
            cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_round.png
            v=$((a*2/3)); convert icono-512.png -resize ${v}x${v} -background none -gravity center -extent ${a}x${a} $R/mipmap-$n/ic_frente.png
          done

      - name: Llave de firma
        env:
          APK_KEYSTORE: ${{ secrets.APK_KEYSTORE }}
        run: |
          set -e
          test -n "$APK_KEYSTORE" || (echo "Falta el secreto APK_KEYSTORE" && exit 1)
          echo "::add-mask::${APK_KEYSTORE%%:*}"
          echo "KS_PASS=${APK_KEYSTORE%%:*}" >> $GITHUB_ENV
          echo "${APK_KEYSTORE#*:}" | base64 -d > android/app/release.jks

      - name: Compilar
        working-directory: android
        env:
          VCODE: ${{ github.run_number }}
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          echo '--- paquetes android-37 disponibles ---'
          "$SDKM" --list 2>/dev/null | grep -E 'platforms;android-3[6-9]|build-tools;3[67]' | tee -a "$GITHUB_STEP_SUMMARY" || true
          ls "$ANDROID_HOME/platforms" || true
          PKG=$("$SDKM" --list 2>/dev/null | grep -oE 'platforms;android-37[^ |]*' | sort -uV | tail -1)
          echo "Instalando: $PKG"
          "$SDKM" --install "$PKG" > /dev/null
          ls "$ANDROID_HOME/platforms" | tee -a "$GITHUB_STEP_SUMMARY"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar archivo
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk InventarioHkjo.apk
          keytool -printcert -jarfile InventarioHkjo.apk | grep SHA256 || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: inventario-apk
          name: Inventario Hkjo. — App Android
          body: Descarga InventarioHkjo.apk en tu Android e instálala.
          files: InventarioHkjo.apk
          make_latest: false
          overwrite_files: true
